<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoList</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>ToDoList</h1>
    <p class="subtitle">Stay organised</p>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="What needs to be done?" autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <div class="filters">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list"></ul>

    <p id="task-count"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
